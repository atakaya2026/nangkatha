<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nangkatha PC Demo</title>
<style>
  body {
    background: url('images/windows.png') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Segoe UI', 'Pyidaungsu', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    height: 100vh; margin: 0; overflow: hidden;
  }
  #notepad-container {
    width: 85%; max-width: 950px; margin-top: 34px;
    background: #fff; box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    border-radius: 5px; overflow: hidden;
  }
  .title-bar {
    background: #4a86e8; color: white; padding: 8px 15px;
    font-size: 14px; display: flex; justify-content: space-between;
  }
  #editor {
    height: min(54vh, 500px); padding: 25px; font-size: 38px; border: none; outline: none;
    white-space: pre-wrap; overflow-y: auto; box-sizing: border-box; position: relative;
  }
  #editor::after {
    content: "|"; display: inline-block; color: #000; width: 2px; margin-left: 2px;
    animation: blink 1s step-end infinite; font-weight: 100;
  }
  @keyframes blink { from, to { color: transparent; } 50% { color: black; } }

  /* ── 키맵 이미지(좌) + 챌린지 버튼(우) ── */
  #kb-area {
    margin-top: 18px; width: 100%;
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 34px;
  }
  #kb-col { display: flex; flex-direction: column; align-items: center; }
  #kb-guide { position: relative; width: min(58vw, 560px); }
  #kb-guide img { width: 100%; display: block; -webkit-user-drag: none; user-select: none; }
  .kb-hit { position: absolute; border-radius: 6px; pointer-events: none; }
  .kb-hit.press { background: rgba(37, 99, 235, 0.30); box-shadow: inset 0 0 0 2px rgba(37,99,235,.55); }
  #baby-label {
    margin-top: 9px; color: #fff; font-size: 14px; font-weight: bold;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.85); letter-spacing: .5px;
  }
  #challenge-btn {
    flex-shrink: 0; padding: 12px 22px; font-size: 1.05em;
    background: #f59e0b; color: #fff; border: none; border-radius: 8px; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.28);
    font-family: 'Pyidaungsu', 'Segoe UI', sans-serif; white-space: nowrap;
  }

  /* ── 미니 내비 (활성 그룹 순환 미리보기) ── */
  #step-nav {
    position: fixed; display: none; z-index: 9000; pointer-events: none;
  }
  #step-nav.visible { display: flex; }
  .snav-group {
    display: flex; border: 1px solid #bbb; background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18); overflow: hidden; border-radius: 4px;
  }
  .snav-cell {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif; font-size: 19px;
    background: #f3f3f3; border-right: 1px solid #ddd; box-sizing: border-box;
  }
  .snav-cell:last-child { border-right: none; }
  .snav-cell.active { background: #d7ebff; }

  .top-btn {
    position: fixed; top: 20px; padding: 10px 18px; font-size: 1.1em;
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 9999;
  }
</style>
</head>
<body>
<button class="top-btn" style="right:78px;  background:#3f6fb8;" onclick="location.href='index.html'">Home</button>
<button class="top-btn" style="right:300px; background:#6b7280;" onclick="resetEditor()">↺ ပြန်ရှင်းရန်</button>
<button class="top-btn" style="right:438px; background:#16a34a;" onclick="goToBoard()">💬 သုံးသပ်ချက် တင်ရန်</button>

<div id="step-nav"></div>

<div id="notepad-container">
  <div class="title-bar"><span>Note</span><span>✕</span></div>
  <div id="editor" contenteditable="false"></div>
</div>

<div id="kb-area">
  <div id="kb-col">
    <div id="kb-guide">
      <img id="kbdimg" src="images/pc_map.png" alt="">
    </div>
    <div id="baby-label">Nangkatha Head-up 1.0</div>
  </div>
  <button id="challenge-btn" onclick="location.href='challenge.html'">🏆 ကီးမပ်မပါဘဲ စိန်ခေါ်ကြည့်မည်!</button>
</div>

<script>
/* ══════════════ 닌카티 엔진 ══════════════ */
const NORMAL_IMG = "images/pc_map.png";
const PLUS_IMG   = "images/pc_plus.png";

const consonantGroups = {
  g_ka:   ["က", "ခ"],            g_nga: ["င", "ဂ", "ဃ"],
  g_ca:   ["စ", "ဆ"],            g_nnya:["ည", "ဇ", "ဈ"],
  g_tta:  ["ဋ", "ဌ"],            g_nna: ["ဏ", "ဍ", "ဎ"],
  g_ta:   ["တ", "ထ"],            g_na:  ["န", "ဒ", "ဓ"],
  g_pa:   ["ပ", "ဖ"],            g_ma:  ["မ", "ဗ", "ဘ"],
  g_ya:   ["ယ", "ရ"],            g_tha: ["သ", "လ", "ဝ"],
  g_a:    ["အ", "ဟ", "ဠ"]
};
const multiTapMap = {
  "i": ["ိ", "ီ", "ဲ"], "j": ["ေ"], "k": ["်", "ံ"], "l": ["ာ", "ါ"],
  ";": ["း", "့"], "m": ["ှ", "ွ"], ",": ["ု", "ူ"], ".": ["ြ", "ျ"]
};
const ZWNJ = "‌", VIRAMA = "္";

/* ── 물리 키(QWERTY) → 닌카티 동작 매핑 ── */
const K_GROUP = {   // 자음 그룹키
  q:"g_nnya", w:"g_ca",  e:"g_ta",  r:"g_pa",  p:"g_tta",
  a:"g_na",   s:"g_nga", d:"g_ka",  f:"g_tha",
  z:"g_nna",  x:"g_a",   c:"g_ma",  v:"g_ya"
};
const K_MULTI = {   // 모음·성조 멀티탭 (물리키 → multiTapMap 키)
  u:"i",  i:"k",
  j:"j",  l:"l",  ";":";",
  m:"m",  ",":",", ".":"."
};
const K_STEP = "k";   // ▶ 변환키
const K_PLUS = "o";   // 그린 + (플러스 모드 토글)

/* ── 플러스 모드: 물리 키 → 삽입 ── */
const P_STACK = {   // ◌္ + 그룹 첫 자음
  q:"g_nnya", w:"g_ca",  e:"g_ta",  r:"g_pa",  p:"g_tta",
  a:"g_na",   s:"g_nga", d:"g_ka",  f:"g_tha",
  z:"g_nna",  x:"g_a",   c:"g_ma",  v:"g_ya"
};
const P_LIT = {      // 독립모음 / 특수문자
  u:"ဣ", i:"ဤ", j:"ဧ", l:"ဩ", ";":"ဪ", m:"ဦ", ",":"ဥ",
  t:"ဉ", y:"၌", g:"၍", h:"၎", b:"ဿ", n:"၏"
};
// t y g h b n : 어떤 모드에서도 바로 입력되는 문자 (플러스판엔 초보자 참고용으로만 표시)
const K_DIRECT = { t:"ဉ", y:"၌", g:"၍", h:"၎", b:"ဿ", n:"၏" };

let state = {
  activeGroup: null, groupIndex: 0,
  lastTapKey: null, tapIndex: 0,
  isPlusMode: false, pendingE: false, pendingStep: false, pendingStepE: false
};

const editor = document.getElementById('editor');
const kbdimg = document.getElementById('kbdimg');
const getText = () => editor.innerText;
const setText = t => { editor.innerText = t; };

const BEFORE_E_SET = new Set([0x103C, 0x103B, 0x103E, 0x103D, 0x103A]);
function analyzePendingStep(text) {
  const eIdx = text.lastIndexOf("ေ");
  if (eIdx === -1) return null;
  const afterE = text.slice(eIdx + 1);
  const beforePart = text.slice(0, eIdx);
  let beEnd = beforePart.length;
  while (beEnd > 0 && BEFORE_E_SET.has(beforePart.codePointAt(beEnd - 1))) beEnd--;
  return { consonant: beforePart.slice(0, beEnd), beforeE: beforePart.slice(beEnd), afterE };
}

function resetStep() { state.activeGroup = null; state.groupIndex = 0; }
function resetState() {
  resetStep(); state.lastTapKey = null; state.tapIndex = 0;
  state.isPlusMode = false; state.pendingE = false; state.pendingStep = false; state.pendingStepE = false;
}

function handleInput(rawKey) {
  const k = rawKey.toLowerCase();
  let t = getText();

  // ── 백스페이스 ──
  if (k === "backspace") {
    if (state.pendingStepE) {
      setText(t.slice(0, -2)); state.pendingStepE = false; state.pendingStep = true;
    } else if (state.pendingStep) {
      const ps = analyzePendingStep(t);
      if (ps && ps.afterE.length > 0) setText(t.slice(0, -1));
      else if (ps && ps.beforeE.length > 0) setText(ps.consonant + "ေ");
      else { const eIdx = t.lastIndexOf("ေ"); setText(t.slice(0, eIdx - 1) + "ေ"); state.pendingStep = false; state.pendingE = true; }
    } else if (state.pendingE) {
      setText(t.endsWith(ZWNJ + "ေ") ? t.slice(0, -2) : t.slice(0, -1)); state.pendingE = false;
    } else {
      setText(t.slice(0, -1));
    }
    state.lastTapKey = null; state.tapIndex = 0;
    resetStep(); afterRender(); return;
  }

  if (k === "enter")  { setText(t + '\n'); resetState(); afterRender(); return; }
  if (k === " " || k === "spacebar" || k === "space") { setText(t + ' '); resetState(); afterRender(); return; }

  // ── 플러스 모드 토글 ──
  if (k === K_PLUS) {
    if (state.pendingStepE) { setText(t.slice(0, -2)); state.pendingStepE = false; }
    resetStep(); state.isPlusMode = !state.isPlusMode; afterRender(); return;
  }

  // ── 플러스 레이어 ──
  if (state.isPlusMode) {
    if (k === K_STEP) return;             // ▶ 는 표시용
    state.isPlusMode = false;
    if (P_STACK[k]) {
      const g = consonantGroups[P_STACK[k]];
      const ch = g[0];
      if (state.pendingStep) {
        const strip = (state.lastTapKey && [".", "m", "k"].includes(state.lastTapKey)) ? 2 : 1;
        setText(getText().slice(0, -strip) + VIRAMA + ch + "ေ");
      } else {
        setText(getText() + VIRAMA + ch);
      }
      state.activeGroup = P_STACK[k]; state.groupIndex = 0;   // ▶ 로 순환 가능하게 유지
      state.lastTapKey = null; state.tapIndex = 0;
      afterRender(); return;
    }
    if (P_LIT[k]) { setText(getText() + P_LIT[k]); resetStep(); afterRender(); return; }
    afterRender(); return;                // 그 외 키는 플러스만 해제
  }

  // ── ▶ 변환키 ──
  if (k === K_STEP) {
    if (!state.activeGroup) return;
    const g = consonantGroups[state.activeGroup];
    state.groupIndex = (state.groupIndex + 1) % g.length;
    const cur = getText();
    if (state.pendingStep) setText(cur.slice(0, -2) + g[state.groupIndex] + "ေ");
    else                   setText(cur.slice(0, -1) + g[state.groupIndex]);
    state.lastTapKey = null; state.tapIndex = 0;
    afterRender(); return;
  }

  // pendingStepE + (ေ 외) → 임시 ေ 확정
  if (state.pendingStepE && k !== "j") {
    state.pendingStepE = false; state.pendingStep = false; state.pendingE = true;
    t = getText();
  }

  // ── 자음 그룹키 ──
  if (K_GROUP[k]) {
    const g = consonantGroups[K_GROUP[k]];
    if (state.pendingE) {
      let base = t.endsWith(ZWNJ + "ေ") ? t.slice(0, -2) : t.slice(0, -1);
      setText(base + g[0] + "ေ");
      state.pendingE = false; state.pendingStep = true;
    } else {
      setText(t + g[0]);
      state.pendingStep = false; state.pendingE = false;
    }
    state.activeGroup = K_GROUP[k]; state.groupIndex = 0;
    state.lastTapKey = null; state.tapIndex = 0;
    afterRender(); return;
  }

  // ── 모음·성조 멀티탭 ──
  if (K_MULTI[k]) {
    const mk = K_MULTI[k];
    const beforeE_keys = [".", "m", "k"];
    if (state.lastTapKey === mk && state.tapIndex < multiTapMap[mk].length - 1) {
      state.tapIndex++;
      const val = multiTapMap[mk][state.tapIndex];
      if (state.pendingStep) {
        const cur = getText();
        if (beforeE_keys.includes(mk)) {
          const eIdx = cur.lastIndexOf("ေ"); const afterE = cur.slice(eIdx + 1);
          setText(cur.slice(0, eIdx - 1) + val + "ေ" + afterE);
        } else setText(cur.slice(0, -1) + val);
      } else setText(getText().slice(0, -1) + val);
      if (mk !== "j") resetStep();
    } else {
      state.lastTapKey = mk; state.tapIndex = 0;
      const val = multiTapMap[mk][0];
      if (mk === "j") {
        setText(getText() + ZWNJ + val);
        state.pendingE = true; state.pendingStep = false; resetStep();
      } else if (state.pendingStep) {
        const cur = getText();
        if (beforeE_keys.includes(mk)) {
          const eIdx = cur.lastIndexOf("ေ"); const afterE = cur.slice(eIdx + 1);
          setText(cur.slice(0, eIdx) + val + "ေ" + afterE);
        } else setText(cur + val);
        resetStep();
      } else if (state.pendingE) {
        const cur = getText();
        const base = cur.endsWith(ZWNJ + "ေ") ? cur.slice(0, -2) : cur.slice(0, -1);
        setText(base + val + "ေ");
        state.pendingE = false; state.pendingStep = true;
      } else {
        setText(getText() + val); resetStep(); state.pendingStep = false;
      }
    }
    afterRender(); return;
  }

  // ── t y g h b n : 어느 모드에서나 바로 입력 ──
  if (K_DIRECT[k]) {
    setText(getText() + K_DIRECT[k]);
    resetState();
    afterRender(); return;
  }
}

/* ══════════════ 화면(키맵 이미지 + 오버레이) ══════════════ */
// pc_map.png / pc_plus.png (1225×356) 실측 키 좌표 (px)
const IMG_W = 1225, IMG_H = 356;
const ROW_Y = [[3,107],[126,231],[248,353]];
const ROW_KEYS = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l",";"],
  ["z","x","c","v","b","n","m",",","."]
];
const ROW_COLS = [
  [[4,105],[118,218],[231,332],[344,445],[457,558],[632,733],[745,846],[859,960],[973,1074],[1087,1188]],
  [[37,137],[151,251],[264,364],[377,478],[490,591],[665,766],[778,879],[892,993],[1006,1107],[1120,1221]],
  [[95,196],[209,310],[322,423],[435,536],[549,649],[723,824],[837,937],[951,1051],[1064,1164]]
];

const hitEls = {};   // key -> div
function buildHits() {
  const guide = document.getElementById('kb-guide');
  guide.querySelectorAll('.kb-hit').forEach(n => n.remove());
  ROW_KEYS.forEach((keys, ri) => {
    const [y0, y1] = ROW_Y[ri];
    keys.forEach((key, ci) => {
      const [x0, x1] = ROW_COLS[ri][ci];
      const d = document.createElement('div');
      d.className = 'kb-hit';
      d.style.left   = (x0 / IMG_W * 100) + '%';
      d.style.top    = (y0 / IMG_H * 100) + '%';
      d.style.width  = ((x1 - x0) / IMG_W * 100) + '%';
      d.style.height = ((y1 - y0) / IMG_H * 100) + '%';
      guide.appendChild(d);
      hitEls[key] = d;
    });
  });
}
function swapImage() {
  const want = state.isPlusMode ? PLUS_IMG : NORMAL_IMG;
  if (!kbdimg.getAttribute('src').endsWith(want)) kbdimg.setAttribute('src', want);
}

function afterRender() {
  swapImage();
  editor.scrollTop = editor.scrollHeight;
  if (state.activeGroup && !state.isPlusMode) showStepNav();
  else hideStepNav();
}

/* ── 미니 내비 ── */
const stepNav = document.getElementById('step-nav');
function getCaretRect() {
  const marker = document.createElement('span');
  marker.textContent = '​';
  editor.appendChild(marker);
  const rect = marker.getBoundingClientRect();
  editor.removeChild(marker);
  return rect;
}
function showStepNav() {
  const group = consonantGroups[state.activeGroup];
  if (!group) { hideStepNav(); return; }
  stepNav.innerHTML = '';
  const g = document.createElement('div');
  g.className = 'snav-group';
  group.forEach((ch, i) => {
    const cell = document.createElement('div');
    cell.className = 'snav-cell' + (i === state.groupIndex ? ' active' : '');
    cell.textContent = ch;
    g.appendChild(cell);
  });
  stepNav.appendChild(g);

  const rect = getCaretRect();
  const navW = group.length * 35, navH = 35;
  let left = rect.left, top = rect.bottom + 6;
  if (left + navW > window.innerWidth  - 8) left = window.innerWidth  - navW - 8;
  if (top  + navH > window.innerHeight - 4) top  = rect.top - navH - 6;
  if (left < 4) left = 4;
  stepNav.style.left = left + 'px';
  stepNav.style.top  = top + 'px';
  stepNav.classList.add('visible');
}
function hideStepNav() { stepNav.classList.remove('visible'); }

/* ── 물리 키보드 — e.code(키 위치)로만 인식. IME·자판배열 무관. ── */
function codeToKey(code) {
  if (/^Key[A-Z]$/.test(code)) return code.slice(3).toLowerCase();
  switch (code) {
    case 'Semicolon': return ';';
    case 'Comma':     return ',';
    case 'Period':    return '.';
    case 'Backspace': return 'backspace';
    case 'Enter': case 'NumpadEnter': return 'enter';
    case 'Space':     return ' ';
  }
  return null;
}

window.addEventListener('keydown', (e) => {
  if (e.repeat) { e.preventDefault(); return; }   // 키 꾹 누름(자동 반복) 무시
  const k = codeToKey(e.code);
  if (k === null) return;                          // 안 쓰는 키(F5 등)는 그대로 통과
  e.preventDefault();
  const hitKey = (k === ' ') ? null : k;
  if (hitKey && hitEls[hitKey]) hitEls[hitKey].classList.add('press');
  handleInput(k);
});
window.addEventListener('keyup', (e) => {
  const k = codeToKey(e.code);
  const el = (k && k !== ' ') ? hitEls[k] : null;
  if (el) el.classList.remove('press');
});

function resetEditor() { setText(''); resetState(); afterRender(); }

function goToBoard() {
  const content = getText().trim();
  if (!content) {
    alert('မည်သည့်စာမျှ မရေးရသေးပါ။ နင်ကတိဖြင့် တစ်ခုခု ရေးကြည့်ပါ!');
    return;
  }
  location.href = `board.html?from=pc&content=${encodeURIComponent(content)}`;
}

buildHits();
afterRender();
</script>
</body>
</html>
